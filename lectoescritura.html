        const el = document.getElementById("feedback");
        el.className = "feedback " + kind;
        el.innerHTML = `<strong>${esc(title)}</strong><p>${esc(body)}</p>`;
      }

      function check() {
        if (checked) return;
        const q = active.questions[index];
        const value = getValue();
        if (
          (q.type === "choice" && selection === null) ||
          (q.type === "text" && !String(value).trim()) ||
          (q.type === "order" && ordered.length !== q.tokens.length)
        ) {
          feedback(
            "neutral",
            "Completa tu respuesta",
            q.type === "order"
              ? "Coloca todas las tarjetas antes de comprobar."
              : "Elige o escribe una respuesta antes de comprobar.",
          );
          if (q.type === "text") document.getElementById("text-answer").focus();
          return;
        }
        if (!isCorrect(q, value)) {
          hadError = true;
          tone(false);
          feedback("error", "Sigue intentando", q.hint);
          return;
        }
        checked = true;
        run.push({ firstTry: !hadError, hint: usedHint, answer: q.answer });
        tone(true);
        const sentenceNote =
          q.sentence && String(value).trim() !== q.answer
            ? " Revisa también la mayúscula y el punto en el modelo."
            : "";
        feedback(
          "success",
          hadError ? "¡Lo lograste!" : "¡Muy bien!",
          q.explanation + sentenceNote,
        );
        document.getElementById("check").hidden = true;
        document.getElementById("next").hidden = false;
        document.getElementById("hint").disabled = true;
        main
          .querySelectorAll(".choice,.text-answer,.token,#clear-order")
          .forEach((el) => (el.disabled = true));
        document.getElementById("next").focus();
      }

      function answerDisplay(q) {
        return Array.isArray(q.answer)
          ? q.answer.join(q.join ?? " → ")
          : q.answer;
      }

      function finish() {
        const first = run.filter((r) => r.firstTry).length;
        const hints = run.filter((r) => r.hint).length;
        saved[active.id] = {
          complete: true,
          firstTry: first,
          hints,
          updated: new Date().toISOString(),
        };
        persist();
        main.innerHTML = `<div class="exercise-wrap"><div class="backrow"><a class="button" href="#inicio">← Actividades</a><span class="small muted">${areaName(active.area)}</span></div><section class="exercise-card"><div class="result-title"><div class="medal" aria-hidden="true">★</div><h1 style="font-size:2rem;letter-spacing:-.02em">¡Actividad completada!</h1><p>${esc(active.title)}</p><p class="muted">Practicar y volver a intentarlo también es aprender.</p></div><div class="result-metrics"><div class="metric"><strong>${first} / 3</strong><span>respuestas al primer intento</span></div><div class="metric"><strong>3 / 3</strong><span>ejercicios resueltos</span></div></div><p class="small muted">Usaste pistas en ${hints} ejercicio${hints === 1 ? "" : "s"}. Este registro corresponde a la práctica de ${esc(session.name)}.</p><h2 style="font-size:1.15rem">Repasemos lo aprendido</h2>${active.questions.map((q, i) => `<details class="review"><summary>Ejercicio ${i + 1}: ${esc(q.prompt)}</summary><p><strong>Respuesta:</strong> ${esc(answerDisplay(q))}</p><p>${esc(q.explanation)}</p></details>`).join("")}<div class="exercise-actions"><a class="button primary" href="#inicio">Elegir otra actividad</a><button class="button" id="repeat">Practicar otra vez</button></div><p class="storage-note">${canSave ? "El resultado se guardó en tu perfil." : "El resultado se conserva mientras mantengas esta página abierta."}</p></section></div>`;
        document.getElementById("repeat").onclick = () => start(active.id);
        focusTitle();
      }

      function downloadCSV() {
        const rows = [
          [
            "Estudiante",
            "Área",
            "Actividad",
            "Título",
            "Estado",
            "Aciertos al primer intento de 3",
            "Ejercicios con pista",
            "Fecha de última práctica",
          ],
        ];
        const studentNames = Object.keys(db);
        if (studentNames.length === 0) {
          rows.push([
            "Sin estudiantes registrados",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
          ]);
        } else {
          for (const stName of studentNames) {
            const stData = db[stName] || {};
            for (const a of ACTIVITIES) {
              const r = stData[a.id];
              rows.push([
                stName,
                areaName(a.area),
                a.number,
                a.title,
                r?.complete ? "Completada" : "Pendiente",
                r?.firstTry ?? "",
                r?.hints ?? "",
                r?.updated ?? "",
              ]);
            }
          }
        }
        const csv =
          "\ufeff" +
          rows
            .map((r) =>
              r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(";"),
            )
            .join("\r\n");
        const url = URL.createObjectURL(
          new Blob([csv], { type: "text/csv;charset=utf-8" }),
        );
        const a = document.createElement("a");
        a.href = url;
        a.download = "Reporte_Avance_Aprendo_Jugando.csv";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      function teacher() {
        if (!session || session.role !== "teacher") {
          location.hash = "inicio";
          return;
        }
        active = null;
        const studentNames = Object.keys(db);
        const reportHTML =
          studentNames.length === 0
            ? '<p class="muted">Aún no hay estudiantes con progreso registrado en este navegador.</p>'
            : `<table class="report-table"><thead><tr><th>Estudiante</th><th>Actividades Completadas</th><th>Lectoescritura</th><th>Matemática</th><th>Aciertos 1er Intento</th><th>Última Actividad</th></tr></thead><tbody>${studentNames
                .map((stName) => {
                  const stData = db[stName] || {};
                  const doneList = ACTIVITIES.filter(
                    (a) => stData[a.id]?.complete,
                  );
                  const doneL = doneList.filter((a) => a.area === "L").length;
                  const doneM = doneList.filter((a) => a.area === "M").length;
                  const totalFirst = doneList.reduce(
                    (acc, a) => acc + (stData[a.id]?.firstTry || 0),
                    0,
                  );
                  const maxFirst = doneList.length * 3;
                  const dates = doneList
                    .map((a) => stData[a.id]?.updated)
                    .filter(Boolean)
                    .sort();
                  const lastDate = dates.length
                    ? new Date(dates[dates.length - 1]).toLocaleString("es-SV")
                    : "Sin registros";
                  return `<tr><td><strong>${esc(stName)}</strong></td><td>${doneList.length} / ${ACTIVITIES.length} (${Math.round((doneList.length / ACTIVITIES.length) * 100)}%)</td><td>${doneL} / 20</td><td>${doneM} / 20</td><td>${totalFirst} / ${maxFirst}</td><td>${lastDate}</td></tr>`;
                })
                .join("")}</tbody></table>`;

        main.innerHTML = `<section class="guide"><div class="backrow no-print"><a class="button" href="#inicio">Ver catálogo como alumno</a><button class="button primary" id="print">Imprimir actividades y reporte</button></div><p class="eyebrow">Panel de Supervisión Docente</p><h1>Seguimiento y banco de ejercicios</h1><p class="guide-intro">40 actividades originales de refuerzo para segundo grado: 20 de Lectoescritura y 20 de Matemática. Cada una incluye 3 ejercicios, pista, respuesta esperada y explicación.</p>
 <section class="guide-box"><h2>Avance registrado por estudiante</h2><p class="small muted">Datos almacenados localmente en este dispositivo.</p>${reportHTML}<div class="no-print" style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap"><button class="button primary" id="export">Descargar reporte completo en CSV</button><button class="button" id="reset-prompt">Borrar registros de estudiantes</button></div><div id="reset-box" hidden class="hint"><p>Se borrarán los resultados de todos los estudiantes en este navegador. Las actividades seguirán disponibles.</p><button class="button danger" id="reset-confirm">Sí, borrar todos los registros</button> <button class="button" id="reset-cancel">Conservar resultados</button></div><p id="reset-status" role="status"></p></section>
 <div class="guide-grid"><section class="guide-box"><h2>Cómo utilizar el paquete</h2><ol><li>Abre siempre desde <strong>index.html</strong> para seleccionar el perfil de Estudiante o Docente.</li><li>El estudiante ingresa su nombre y su avance se guarda automáticamente bajo su perfil en este navegador.</li><li>El docente ingresa con su PIN para verificar el progreso de cada alumno, exportar los datos a Excel (CSV) o imprimir las guías.</li><li>Todo funciona sin conexión a internet y sin instalaciones adicionales.</li></ol></section><section class="guide-box"><h2>Propuesta metodológica</h2><ol><li><strong>Inicio, 5 minutos:</strong> conversa sobre lo que saben y presenta un reto con objetos, palabras o ejemplos cercanos.</li><li><strong>Desarrollo, 15–20 minutos:</strong> realiza de una a tres actividades, según el ritmo del grupo. Trabajen individualmente, en parejas o mediante proyección.</li><li><strong>Cierre, 5 minutos:</strong> pide explicar una respuesta y resolver un ejemplo nuevo en el cuaderno.</li><li><strong>Observa:</strong> comprensión de instrucciones, estrategia, explicación de la respuesta y autonomía.</li></ol></section></div>
 <section class="guide-box"><h2>Base curricular y autoría</h2><p><strong>Comunicación, segundo grado:</strong> tomos 1 y 2, segunda edición de 2022, tercera reimpresión de 2025. <strong>Números y Formas, segundo grado:</strong> tomos 1 y 2, segunda edición de 2019, sexta reimpresión de 2025. Materiales del Ministerio de Educación, Ciencia y Tecnología de El Salvador.</p><p><strong>Proyecto:</strong> Aprendo Jugando: Plataforma Interactiva de Lectoescritura y Matemática. <strong>Institución beneficiaria:</strong> Centro Escolar Cantón San José, segundo grado «A». <strong>Equipo:</strong> Néstor Stanly Chávez Ramos, Edenilson Alonso Pérez Belloso y Walter Stanley Hernández Iraheta. Aplicaciones de la Informática en la Educación II, Universidad de El Salvador, 2026.</p></section>
 <h2>Las 40 actividades y sus respuestas</h2><p class="muted">Abre una actividad para consultar los tres ejercicios. El botón Imprimir incluye todas las respuestas.</p>${ACTIVITIES.map((a) => `<details class="teacher-activity"><summary>${a.id} · ${esc(a.title)}</summary><div class="teacher-body"><p><strong>Área:</strong> ${areaName(a.area)}. <strong>Objetivo:</strong> ${esc(a.objective)}</p><p><strong>Referencia:</strong> ${esc(a.reference)}</p><p><strong>Interacción:</strong> ${[...new Set(a.questions.map((q) => ({ choice: "seleccionar una opción", text: "escribir una respuesta", order: "ordenar tarjetas con botones" })[q.type]))].join("; ")}.</p>${a.passage ? `<p><strong>Lectura:</strong> ${esc(a.passage)}</p>` : ""}<ol>${a.questions.map((q) => `<li><p>${esc(q.prompt)}</p>${q.options ? `<p><strong>Opciones:</strong> ${q.options.map(esc).join(" / ")}.</p>` : ""}${q.tokens ? `<p><strong>Tarjetas:</strong> ${q.tokens.map(esc).join(" / ")}.</p>` : ""}<p class="answer-key">Respuesta: ${esc(answerDisplay(q))}</p><p><strong>Pista:</strong> ${esc(q.hint)}</p><p><strong>Explicación:</strong> ${esc(q.explanation)}</p></li>`).join("")}</ol></div></details>`).join("")}</section>`;
        document.getElementById("export").onclick = downloadCSV;
        document.getElementById("print").onclick = () => {
          main.querySelectorAll("details").forEach((d) => (d.open = true));
          window.print();
        };
        document.getElementById("reset-prompt").onclick = () => {
          document.getElementById("reset-box").hidden = false;
          document.getElementById("reset-confirm").focus();
        };
        document.getElementById("reset-cancel").onclick = () => {
          document.getElementById("reset-box").hidden = true;
          document.getElementById("reset-prompt").focus();
        };
        document.getElementById("reset-confirm").onclick = () => {
          db = {};
          try {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
          } catch (e) {}
          document.getElementById("reset-box").hidden = true;
          teacher();
          document.getElementById("reset-status").textContent =
            "Se borraron los registros de los estudiantes.";
        };
      }

      function route() {
        const hash = location.hash.slice(1);
        if (hash === "docente") {
          teacher();
          focusTitle();
        } else if (hash.startsWith("actividad/")) start(hash.split("/")[1]);
        else {
          home();
          focusTitle();
        }
      }
      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
